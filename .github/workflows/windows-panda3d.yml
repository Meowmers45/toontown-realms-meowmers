name: Build Toontown Panda3D for Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-panda3d.yml'

permissions:
  contents: read

jobs:
  wheel:
    runs-on: windows-2022
    steps:
      - name: Check out the Panda3D fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Meowmers45/panda3d-ttoff-Meowmers
          ref: 2d20af7f7f46a7cd316f6dc165f3dc0dc984372b
          persist-credentials: false

      - name: Check out the game launcher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: game-source
          persist-credentials: false

      - name: Install Panda3D build dependencies
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'panda3d-tools.zip'
          curl.exe --fail --location --retry 3 -o $archive https://www.panda3d.org/download/panda3d-1.10.16/panda3d-1.10.16-tools-win64.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'c94d346ce486c65a4a251c72360155b7f4f4aa8e6fd702690b7a0aca8ed3616c') {
            throw 'Panda3D third-party archive checksum mismatch.'
          }
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP
          Move-Item (Join-Path $env:RUNNER_TEMP 'panda3d-1.10.16/thirdparty') ./

      - name: Apply compatibility fixes to the pinned fork
        shell: pwsh
        run: |
          # This fork already links the current Panda libraries through COMMON_PANDA_LIBS.
          $makepanda = (Resolve-Path 'makepanda/makepanda.py').Path
          $obsolete = "    PyTargetAdd('toontown.pyd', input='libp3interrogatedb.dll')"
          $lines = [System.IO.File]::ReadAllLines($makepanda)
          if (@($lines | Where-Object { $_ -ceq $obsolete }).Count -ne 1) {
            throw 'Expected exactly one obsolete Toontown linker input.'
          }
          [System.IO.File]::WriteAllLines($makepanda, [string[]]($lines | Where-Object { $_ -cne $obsolete }))

          # MSVC's C++17 standard library removed random_shuffle.
          $margin = (Resolve-Path 'panda/src/toontown/marginManager.cxx').Path
          $source = [System.IO.File]::ReadAllText($margin)
          $old = 'random_shuffle(empty_cells.begin(), empty_cells.end());'
          if ([regex]::Matches($source, [regex]::Escape($old)).Count -ne 2) {
            throw 'Expected exactly two legacy margin cell shuffles.'
          }
          $source = $source.Replace('#include <algorithm>', "#include <algorithm>`n#include <cstdlib>`n#include <random>")
          $source = $source.Replace($old, 'std::shuffle(empty_cells.begin(), empty_cells.end(), std::mt19937(std::rand()));')
          [System.IO.File]::WriteAllText($margin, $source)

      - name: Use a per-user default installation directory
        shell: pwsh
        run: |
          $package = (Resolve-Path 'makepanda/makepackage.py').Path
          $source = [System.IO.File]::ReadAllText($package)
          $old = 'dir = "C:\\Panda3D-TTRMDev-" + version'
          $new = 'dir = "$LOCALAPPDATA\\Panda3D-TTRMDev-" + version'
          if (($source.Split(@($old), [StringSplitOptions]::None).Length - 1) -ne 1) {
            throw 'Expected exactly one default Panda3D installation directory.'
          }
          [System.IO.File]::WriteAllText($package, $source.Replace($old, $new))

      - name: Build the x64 installer and Python 3.12 wheel
        shell: pwsh
        run: |
          & ./thirdparty/win-python3.12-x64/python.exe makepanda/makepanda.py --installer --wheel --everything --msvc-version=14.3 --windows-sdk=10 --arch=x64 --no-eigen --no-tinydisplay --no-openexr --no-squish --threads=4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Verify Toontown extensions in the wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -Path . -Filter '*.whl' | Select-Object -First 1
          if (!$wheel) { throw 'Panda3D wheel was not produced.' }
          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from panda3d.toontown import DNAStorage, Nametag; from direct import discord_rpc"

      - name: Install and verify the x64 installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path . -Filter 'Panda3D-TTRMDev-*-x64.exe'
          if (@($installer).Count -ne 1) { throw 'Expected one Panda3D x64 installer.' }
          $destination = Join-Path $env:RUNNER_TEMP 'Panda3D-Installer-Test'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed with exit code $($process.ExitCode)." }
          $python = Join-Path $destination 'python/ppython.exe'
          if (!(Test-Path $python)) { throw 'Installer did not include ppython.exe.' }
          if (!(Test-Path (Join-Path $destination 'bin/libpandagl.dll'))) { throw 'OpenGL renderer missing.' }
          $env:PYTHONPATH = $null
          & $python -c "import struct; assert struct.calcsize('P') == 8; from panda3d.toontown import DNAStorage, Nametag; from panda3d import ode; from direct import discord_rpc; print('x64 Panda3D installer verified')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify the game launcher's installer fallback
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'launcher-fixture'
          $local = Join-Path $env:RUNNER_TEMP 'launcher-local'
          $source = Join-Path $env:RUNNER_TEMP 'Panda3D-Installer-Test'
          $destination = Join-Path $local 'Panda3D-TTRMDev-1.11.0-x64'
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture 'win32'), (Join-Path $fixture 'toontown/launcher'), $local | Out-Null
          Move-Item $source $destination
          Copy-Item 'game-source/win32/start_game.bat' (Join-Path $fixture 'win32/start_game.bat')
          Set-Content (Join-Path $fixture 'PPYTHON_PATH') '"C:\missing\ppython.exe"'
          Set-Content (Join-Path $fixture 'toontown/launcher/ToontownOfflineQuickStartLauncher.py') "import os; assert os.environ['TTOFF_PLAY_TOKEN'] == 'dev'; assert os.environ['TTOFF_GAME_MODE'] == '0'; open('launch-ok', 'w').close()"
          $env:LOCALAPPDATA = $local
          Push-Location (Join-Path $fixture 'win32')
          try {
            cmd /c "start_game.bat < NUL"
            $marker = Join-Path $fixture 'launch-ok'
            if (!(Test-Path $marker)) { throw 'Game launcher did not use the installer fallback.' }
            Remove-Item $marker
            Set-Content (Join-Path $fixture 'PPYTHON_PATH') ('"' + (Join-Path $destination 'python/ppython.exe') + '"')
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'no-panda-installed'
            cmd /c "start_game.bat < NUL"
            if (!(Test-Path $marker)) { throw 'Game launcher did not use its configured interpreter.' }
            Remove-Item $marker
            Set-Content (Join-Path $fixture 'PPYTHON_PATH') '"C:\missing\ppython.exe"'
            cmd /c "start_game.bat < NUL"
            if ($LASTEXITCODE -ne 1 -or (Test-Path $marker)) { throw 'Missing Panda3D was not reported.' }
            $global:LASTEXITCODE = 0
          } finally {
            Pop-Location
          }

      - name: Upload the verified Windows x64 installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panda3d-ttoff-windows-x64-installer
          path: 'Panda3D-TTRMDev-*-x64.exe'
          if-no-files-found: error

      - name: Upload the verified wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: panda3d-ttoff-windows-x64-cp312
          path: '*.whl'
          if-no-files-found: error

  launcher:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Test launcher interpreter selection
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'launcher-fixture'
          $local = Join-Path $env:RUNNER_TEMP 'launcher-local'
          $destination = Join-Path $local 'Panda3D-TTRMDev-1.11.0-x64/python'
          New-Item -ItemType Directory -Force -Path (Join-Path $fixture 'win32'), (Join-Path $fixture 'toontown/launcher'), $destination | Out-Null
          Copy-Item 'win32/start_game.bat' (Join-Path $fixture 'win32/start_game.bat')
          Copy-Item (Join-Path $env:pythonLocation '*') $destination -Recurse -Force
          Copy-Item (Join-Path $destination 'python.exe') (Join-Path $destination 'ppython.exe')
          Set-Content (Join-Path $fixture 'toontown/launcher/ToontownOfflineQuickStartLauncher.py') "import os; assert os.environ['TTOFF_PLAY_TOKEN'] == 'dev'; assert os.environ['TTOFF_GAME_MODE'] == '0'; open('launch-ok', 'w').close()"
          Set-Content (Join-Path $fixture 'PPYTHON_PATH') '"C:\missing\ppython.exe"'
          $env:LOCALAPPDATA = $local
          Push-Location (Join-Path $fixture 'win32')
          try {
            cmd /c "start_game.bat < NUL"
            $marker = Join-Path $fixture 'launch-ok'
            if (!(Test-Path $marker)) { throw 'Game launcher did not use the installer fallback.' }
            Remove-Item $marker
            Set-Content (Join-Path $fixture 'PPYTHON_PATH') ('"' + (Join-Path $destination 'ppython.exe') + '"')
            $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'no-panda-installed'
            cmd /c "start_game.bat < NUL"
            if (!(Test-Path $marker)) { throw 'Game launcher did not use its configured interpreter.' }
            Remove-Item $marker
            Set-Content (Join-Path $fixture 'PPYTHON_PATH') '"C:\missing\ppython.exe"'
            cmd /c "start_game.bat < NUL"
            if ($LASTEXITCODE -ne 1 -or (Test-Path $marker)) { throw 'Missing Panda3D was not reported.' }
            $global:LASTEXITCODE = 0
          } finally {
            Pop-Location
          }
